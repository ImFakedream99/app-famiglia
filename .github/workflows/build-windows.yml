name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run dist:win

      - name: Create installer release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release/Famiglia-Installer-*.exe
          generate_release_notes: true

      - name: Publish app update notification
        shell: pwsh
        env:
          UPDATE_FUNCTION_URL: https://chhdzphryqothrdwhiep.supabase.co/functions/v1/publish-app-update
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          $version = node -p "require('./package.json').version"
          $message = (git log -1 --pretty=%s)
          $commitUrl = "https://github.com/$env:GITHUB_REPOSITORY_VALUE/commit/$env:GITHUB_SHA_VALUE"

          $assets = $env:RELEASE_ASSETS | ConvertFrom-Json
          $installer = $assets | Where-Object { $_.name -like 'Famiglia-Installer-*.exe' } | Select-Object -First 1
          if (-not $installer -or -not $installer.browser_download_url) {
            throw "Installer asset URL non disponibile nella Release."
          }

          $body = @{
            repository = $env:GITHUB_REPOSITORY_VALUE
            version = $version
            commit_sha = $env:GITHUB_SHA_VALUE
            commit_message = $message
            commit_url = $commitUrl
            download_url = $installer.browser_download_url
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $($env:GITHUB_TOKEN_VALUE)"
            "Content-Type" = "application/json"
          }

          Invoke-RestMethod -Method Post -Uri $env:UPDATE_FUNCTION_URL -Headers $headers -Body $body

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Famiglia-Windows-Installer
          path: release/Famiglia-Installer-*.exe
          if-no-files-found: error

# Build uses the latest main source for every installer artifact.
# Trigger build verification.
